# OWASP CRS Plugin Registry
# Authoritative list of registered plugins: rule ID range allocation and the
# vetting signal (type, status). Changed only through reviewed PRs.
# See registry-schema.json for the full JSON Schema definition and
# docs/registry-schema.md for what this file attests.

